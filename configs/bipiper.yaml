# Piper hardware settings. Camera devices are configured separately in cameras.yaml.
robot:
  type: bi_piper
  id: bi_piper
  left_port: can0
  right_port: can1
  # Machine-local physical limits. Gripper actions exposed to policies are [0, 1].
  gripper_calibration_path: ~/.mu-robotics/bipiper.yaml
  gripper_action_tolerance: 0.1
  command_rate_hz: 100.0
  # Match XHuman's proven VR command streamer limits. Lower values here make
  # the physical arms trail the already-filtered/interpolated VR trajectory.
  max_joint_speed_deg_s: 180.0
  max_joint_acceleration_deg_s2: 720.0
  speed_percent: 80
