# Shared hardware settings for VR and hardware tools.
# The inference section below supplies deployment-specific overrides.
robot:
  type: bi_piper
  id: bi_piper
  left_port: can0
  right_port: can1
  # Machine-local physical limits. Gripper actions exposed to policies are [0, 1].
  gripper_calibration_path: ~/.mu-robotics/bipiper.yaml
  gripper_action_tolerance: 0.1
  command_rate_hz: 100.0
  # Match XHuman's proven VR command streamer limits. Lower values here make
  # the physical arms trail the already-filtered/interpolated VR trajectory.
  max_joint_speed_deg_s: 180.0
  max_joint_acceleration_deg_s2: 720.0
  speed_percent: 80

# Applied only by the inference robot server; VR/tools use robot above.
inference:
  robot:
    gripper_action_tolerance: 0.2
    max_joint_speed_deg_s: 20.0
    max_joint_acceleration_deg_s2: 60.0
    speed_percent: 40
    cameras:
      left:
        type: opencv
        index_or_path: /dev/v4l/by-path/pci-0000:06:00.4-usb-0:1:1.0-video-index0
        width: 640
        height: 480
        fps: 30
        backend: V4L2
      top:
        type: zedmini
        index_or_path: /dev/v4l/by-path/pci-0000:06:00.3-usb-0:1:1.0-video-index0
        width: 1344
        height: 376
        fps: 30
        backend: V4L2
      right:
        type: opencv
        index_or_path: /dev/v4l/by-path/pci-0000:06:00.4-usb-0:2:1.0-video-index0
        width: 640
        height: 480
        fps: 30
        backend: V4L2
  motion_filter:
    enabled: true
    min_cutoff_hz: 2.0
    velocity_coefficient: 3.0
    derivative_cutoff_hz: 5.0
    gripper_max_rate_per_s: 3.0
    snap_tolerance: 0.001
