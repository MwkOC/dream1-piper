# Camera names intentionally match the training dataset feature names:
# observation.images.left, observation.images.top, observation.images.right.
cameras:
  left:
    type: opencv
    index_or_path: /dev/v4l/by-path/pci-0000:06:00.4-usb-0:1:1.0-video-index0
    width: 640
    height: 480
    fps: 30
    backend: V4L2

  top:
    type: zedmini
    index_or_path: /dev/v4l/by-path/pci-0000:06:00.3-usb-0:1:1.0-video-index0
    # UVC exposes both 672x376 eyes side by side. The MU driver returns the left eye.
    width: 1344
    height: 376
    fps: 30
    backend: V4L2

  right:
    type: opencv
    index_or_path: /dev/v4l/by-path/pci-0000:06:00.4-usb-0:2:1.0-video-index0
    width: 640
    height: 480
    fps: 30
    backend: V4L2
