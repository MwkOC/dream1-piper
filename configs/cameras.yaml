# Camera names intentionally match the training dataset feature names:
# observation.images.left, observation.images.top, observation.images.right.
cameras:
  left:
    type: opencv
    index_or_path: /dev/video0
    width: 640
    height: 480
    fps: 30
    backend: V4L2

  top:
    type: zedmini
    # SDK VGA: rectified left image, 672x376. Optionally select a camera
    # with serial_number: 12345678 when multiple ZED cameras are connected.
    fps: 30

  right:
    type: opencv
    index_or_path: /dev/video4
    width: 640
    height: 480
    fps: 30
    backend: V4L2
