# Official Dream station configuration plus the experiment's read-only Piper driver.
body: custom
custom:
  driver: piper_driver.py:PiperArm
  ik: arm.pending.json
  embodiment: REPLACE_ACCOUNT/piper-bimanual

follower_l:
  can_channel: can0
  home: [0.0, 0.0, 0.0, 0.0, 0.4363323, 0.0]
follower_r:
  can_channel: can1
  home: [0.0, 0.0, 0.0, 0.0, 0.4363323, 0.0]

cameras:
  - name: overhead
    source: zed_left.py:ZedLeft
    width: 672
    height: 376
    fps: 30
  - name: wrist_l
    device: /dev/video0
    width: 640
    height: 480
    fps: 30
  - name: wrist_r
    device: /dev/video4
    width: 640
    height: 480
    fps: 30

control_hz: 20
action_horizon: 48
obs_window: 9
obs_fps: 5.0
policy_image_size: 320x176
stale_after_s: 0.2
max_stall_ticks: 240
max_ee_speed_m_s: 0.6
grip_force_cap: 0
max_gripper_step: 0.05
home_on_key_refused: false

