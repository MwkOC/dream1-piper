# Hardware configuration extracted from origin/temasA (e67a701, 9426238).
# This file describes the local robot; it does not register an embodiment remotely.
robot:
  type: bi_piper
  id: bi_piper
  left_port: can0
  right_port: can1
  gripper_calibration_path: ~/.mu-robotics/bipiper.yaml
  command_rate_hz: 100.0
  max_joint_speed_deg_s: 180.0
  max_joint_acceleration_deg_s2: 720.0
  startup_speed_percent: 10
  speed_percent: 80
  enable_timeout_s: 10.0
  gripper_effort: 1000
  gripper_action_tolerance: 0.1
  home_max_joint_speed_deg_s: 20.0
  home_timeout_s: 30.0
  home_tolerance_deg: 3.0

  cameras:
    left:
      type: opencv
      index_or_path: /dev/v4l/by-path/pci-0000:06:00.4-usb-0:1:1.0-video-index0
      width: 640
      height: 480
      fps: 30
    top:
      type: zedmini
      index_or_path: /dev/v4l/by-path/pci-0000:06:00.3-usb-0:1:1.0-video-index0
      width: 1344
      height: 376
      fps: 30
    right:
      type: opencv
      index_or_path: /dev/v4l/by-path/pci-0000:06:00.4-usb-0:2:1.0-video-index0
      width: 640
      height: 480
      fps: 30

urdf: assets/piper.urdf
frames:
  left_base: left_base_link
  left_tcp: left_tcp
  right_base: right_base_link
  right_tcp: right_tcp

inference:
  start:
    enabled: false
    pose_file: null
    pose: nearest_to_mean
    max_joint_speed_deg_s: 10.0
    timeout_s: 45.0
    tolerance_deg: 2.0
