# Extracted from HandUMI configuration; these are not new physical measurements.
source:
  repository: /home/mwkoc/GITHUB/NoHuman/handumi/handumi-sw
  commit: 55e1e6e1f2a490029dec2548d754a28bd7d2ba64
  robot_profile: configs/robots/piper.yaml
  rig_profile: configs/rig.yaml
  driver: src/handumi/real/piper/driver.py
  urdf: assets/piper/piper.urdf

can:
  left: can0
  right: can1
  bitrate: 1000000
  restart_ms: 100

# The seventh value on each side in HandUMI home_q is the pinza, not an arm joint.
home_rad:
  left: [0.0, 0.0, 0.0, 0.0, 0.4363323, 0.0]
  right: [0.0, 0.0, 0.0, 0.0, 0.4363323, 0.0]
home_gripper_opening: 0.0

# A partial IK preference, not a complete six-joint Dream rest pose.
posture_rad:
  left: [0.0, 1.7453293, -1.5358897, null, null, null]
  right: [0.0, 1.7453293, -1.5358897, null, null, null]

native_control_reference:
  command_rate_hz: 100
  max_joint_speed_deg_s: 180
  max_joint_acceleration_deg_s2: 720
  home_max_joint_speed_deg_s: 20
  home_timeout_s: 30
  home_tolerance_deg: 3
  startup_speed_percent: 10
  speed_percent: 80
  gripper_effort: 1000

# Nominal model data, not operator-confirmed tool calibration for Dream.
nominal_tcp:
  parent: left_link6
  child: left_tcp
  xyz_m: [0.0, 0.0, 0.1358]
  rpy_rad: [0.0, 0.0, 0.0]
  physical_confirmation: pending
gripper_max_width_m: 0.066
gripper_zero_calibration:
  path: ~/.cache/handumi/piper_grippers.yaml
  found_on_this_machine: false
  format: per-side closed_microm only; open endpoint must be resolved separately

# Snapshot of the local HandUMI file; its role assignment is superseded below.
rig_camera_mapping:
  left_wrist: {type: opencv, index: 0, width: 640, height: 480, fps: 30}
  right_wrist: {type: zedmini, index: 2, width: 1344, height: 376, fps: 30}
  workspace: {type: opencv, index: 4, width: 640, height: 480, fps: 30}

# User correction: ZED Mini is overhead, not wrist_r. Device indices still need hardware verification.
confirmed_camera_mapping:
  left_wrist: {type: opencv, index: 0, width: 640, height: 480, fps: 30}
  right_wrist: {type: opencv, index: 4, width: 640, height: 480, fps: 30}
  workspace: {type: zedmini, index: 2, width: 1344, height: 376, fps: 30}
