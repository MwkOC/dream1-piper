# Template for manual setup. TCP/embodiment are pending; the driver only reads feedback.
body: custom
custom:
  driver: piper_readonly.py:ReadOnlyArm
  ik: arm.pending.json
  embodiment: REPLACE_ACCOUNT/piper-bimanual

# CAN and home from HandUMI configs/rig.yaml and configs/robots/piper.yaml.
# Configured home, not a new measurement. Verify the physical pose and access trajectory.
follower_l:
  can_channel: can0
  home: [0.0, 0.0, 0.0, 0.0, 0.4363323, 0.0]
follower_r:
  can_channel: can1
  home: [0.0, 0.0, 0.0, 0.0, 0.4363323, 0.0]

# Roles of the zero-shot embodiment registered by setup for a custom URDF.
cameras:
  - name: overhead
    source: zed_left.py:ZedLeft
    width: 672  # stereo 1344x376, left eye only
    height: 376
    fps: 30
  - name: wrist_l
    device: /dev/video0
    width: 640  # confirm actual negotiated mode; these are provisional
    height: 480
    fps: 30
    rotate: 0
  - name: wrist_r
    device: /dev/video4
    width: 640
    height: 480
    fps: 30
    rotate: 0

# Upstream station defaults. This template's driver cannot execute any action.
control_hz: 20
action_horizon: 48
obs_window: 9
obs_fps: 5.0
policy_image_size: 320x176
stale_after_s: 0.2
max_stall_ticks: 240
max_ee_speed_m_s: 0.6
grip_force_cap: 0  # feedback-only driver does not report grip effort
max_gripper_step: 0.05
home_on_key_refused: false
