[project]
name = "dream1-piper-app"
version = "0.1.0"
description = "Stable FastAPI boundary for the Dream-1 Piper project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]>=0.35,<1",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dream1_piper_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

