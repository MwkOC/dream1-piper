[project]
name = "dream1-piper-app"
version = "0.1.0"
description = "LAN station and Dream worker for bimanual Piper"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]==0.163.1",
  "scalar-fastapi>=1.8.2,<2",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "websockets>=15,<17",
  "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3",
  "opencv-python-headless>=4.10,<6",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dream = [
  "dreamlabs==1.0.37",
  "dreamlabs-client==1.1.3",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "opencv-python-headless>=4.10,<6",
  "python-dotenv>=1,<2",
  "yourdfpy==0.0.60",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=1.0,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
dream1-piper-station = "dream1_piper.main:run"
dream1-piper-worker = "dream1_piper.worker.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/dream1_piper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
